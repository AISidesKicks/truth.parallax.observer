{
  "service_name": "parallax-observer",
  "storage": {
    "workspace": "${VIKING_WORKSPACE}",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_base": "${VIKING_EMBEDDING_BASE}",
      "api_key": "${VIKING_EMBEDDING_API_KEY}",
      "model": "${VIKING_EMBEDDING_MODEL}",
      "dimension": 768,
      "encoding_format": "float",
      "input": "text",
      "batch_size": 16
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "${VIKING_VLM_BASE}",
    "api_key": "${VIKING_VLM_API_KEY}",
    "model": "${VIKING_VLM_MODEL}",
    "timeout": 120,
    "max_tokens": 1024
  },
  "retrieval": {
    "enable_intent": false
  }
}
