; parallax.observer - llama.cpp model presets
;
; One llama.cpp server in router mode serves both models. The section name is
; the model id the API routes on, so the request body must carry
; "model": "granite-4.0-h-tiny" or "model": "embeddinggemma-2".
;
; Keys are command line arguments without the leading dashes.
; See https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md

version = 1

; Shared by every model. The router overrides host, port, api key and alias.
[*]
n-gpu-layers = 99
flash-attn = on
; the app reads the model stats, and the GPU stats, from here
metrics = true

; Chat model. Thinking is on, the reasoning trace comes back in
; reasoning_content and the answer in content.
[granite-4.0-h-tiny]
model = /models/granite-4.0-h-tiny-Q4_K_M.gguf
ctx-size = 32768
parallel = 2
batch-size = 2048
ubatch-size = 512
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = on
reasoning-format = deepseek
load-on-startup = true

; Embedding model. The embeddings flag is what turns the instance into an
; encoder instead of a generator, and it has to be set per preset.
; The batch size has to match the context, otherwise anything longer than
; the batch is rejected with "input is too large to process".
;
; This is EmbeddingGemma 2, which is multimodal: 270M of text encoder,
; 170M of vision and 300M of audio, 768 dimensions with MRL down to 128.
; It needs a llama.cpp build with the gemma-embedding2 architecture, which
; landed in b11455. The server-cuda13 tag carries it from build 11455 on.
;
; Pooling is mean, not last, which is what the model was trained with.
; The context is 8192 tokens, and the batch has to match it. At 2048 the
; symbol dense chunks, the geodesy formulas, were rejected with "input is
; too large to process". 4096 gives them room.
[embeddinggemma-2]
model = /models/embeddinggemma-2-Q8_0.gguf
; the vision encoder, so the corpus can hold images too
mmproj = /models/mmproj-embeddinggemma-2-Q8_0.gguf
embeddings = true
pooling = mean
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
load-on-startup = false
