[workspace]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "prlx"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# --- local stack ---------------------------------------------------------
up = { cmd = "bash docker/up.sh", description = "Start the local stack (llm, embed, viking, phoenix, app)" }
down = { cmd = "bash docker/down.sh", description = "Stop the local stack" }
status = { cmd = "bash docker/status.sh", description = "Show service status and endpoints" }
logs = { cmd = "docker compose -f docker/docker-compose.yml logs -f", description = "Follow the service logs" }
models = { cmd = "bash docker/fetch-models.sh", description = "Download the GGUF models into .models/llama" }

# --- quality -------------------------------------------------------------
test = { cmd = "pytest -q", description = "Run the test suite", default-environment = "experiment" }
lint = { cmd = "ruff check .", description = "Lint the code" }
format = { cmd = "ruff format .", description = "Format the code" }

# --- viking --------------------------------------------------------------
viking-migrate = { cmd = "python scripts/migrate_to_viking.py", description = "Seed the corpus into the OpenViking workspace" }
viking-reindex = { cmd = "python scripts/migrate_to_viking.py --reindex", description = "Seed the corpus and rebuild the vector index" }
viking-probe = { cmd = "python scripts/probe_viking.py", description = "Run a scoped retrieval against the corpus" }

# --- corpus --------------------------------------------------------------
chunk-knowledge = { cmd = "python scripts/chunk_knowledge.py", description = "Rebuild the knowledge tier from the raw sources" }
summarize-knowledge = { cmd = "python scripts/chunk_knowledge.py --summarize --resume", description = "Generate the L0 and L1 tiers of the knowledge corpus" }
prune-enrichment = { cmd = "python scripts/expand_enrichment.py --prune", description = "Remove wisdoms that no longer match the seed files" }
expand-enrichment = { cmd = "python scripts/expand_enrichment.py --all --resume", description = "Expand the enrichment seeds into wisdoms" }

[dependencies]
python = "==3.12"

[feature.core.dependencies]
fastapi = ">=0.115"
uvicorn = ">=0.30"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
httpx = ">=0.27"
pyyaml = ">=6.0"
openai = ">=1.0"
python-dotenv = ">=1.0"
rich = ">=13.0"
psutil = ">=5.9"
ruff = ">=0.6"

[feature.core.pypi-dependencies]
openviking-sdk = ">=0.1.16,<0.2"
nvidia-ml-py = ">=12.535,<14"

[feature.experiment.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
anyio = ">=4.0"
respx = ">=0.21"

[feature.benchmarks.dependencies]
pandas = ">=2.0"
matplotlib = ">=3.8"
seaborn = ">=0.13"
rapidfuzz = ">=3.0"

[environments]
default = ["core"]
experiment = ["core", "experiment"]
benchmarks = ["core", "benchmarks"]

[pypi-dependencies]
markdownify = ">=1.2.3, <2"
